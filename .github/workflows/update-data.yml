name: Update data
on:
  schedule:
    - cron: '0 6,22 * * *'   # 6h et 22h UTC (8h et minuit Paris) — 2×/jour pendant la CDM 12 juin–19 juillet 2026
  workflow_dispatch:           # déclenchement manuel possible

permissions:
  contents: write              # autorise le push depuis github-actions[bot]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data
        run: python3 fetch_data.py

      - name: Fetch FIFA ranking
        run: python3 fetch_fifa_ranking.py

      - name: Generate web data
        run: python3 generate_web_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "Aucun changement" && exit 0
          git commit -m "chore: mise à jour données $(date -u +%Y-%m-%d_%HhUTC)"
          git pull --rebase origin master
          git push
